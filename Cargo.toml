[package]
name = "taintgate"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "MCP gateway that labels tool outputs with information-flow labels and blocks lethal-trifecta flows (private data + untrusted content + exfiltration sink)."
authors = ["Federico Nicolas Báez Rizzo"]
repository = "https://github.com/federiconbaez/cortex9-taintgate"
readme = "README.md"
keywords = ["mcp", "information-flow", "prompt-injection", "gateway", "security"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "taintgate"
path = "src/lib.rs"

[[bin]]
name = "taintgate"
path = "src/bin/taintgate.rs"

[[bin]]
name = "taintgate-world"
path = "src/bin/taintgate-world.rs"

[[bin]]
name = "taintgate-bench"
path = "src/bin/taintgate-bench.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
ureq = { version = "2", default-features = false }
tiny_http = "0.12"
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 1
